---
# team-catalog — API scale-out, resources raisonnables.
# Derived from docs/scenarios.md — Scénario 2 (traffic spike + HPA).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: team-catalog
  labels:
    team: team-catalog
    product: catalog-api
    env: lab
    app: catalog-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-api
  template:
    metadata:
      labels:
        team: team-catalog
        product: catalog-api
        env: lab
        app: catalog-api
    spec:
      containers:
        - name: catalog-api
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          # Profil sain : requests proches de l'usage, marge en limits.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-api
  namespace: team-catalog
  labels:
    team: team-catalog
    product: catalog-api
    env: lab
spec:
  selector:
    app: catalog-api
  ports:
    - name: http
      port: 80
      targetPort: 80
