---
# team-checkout — namespace + garde-fous
# Profil : over-provisioning volontaire (requests >> usage). Voir behavior.md.
apiVersion: v1
kind: Namespace
metadata:
  name: team-checkout
  labels:
    team: team-checkout
    product: checkout-api
    env: lab
---
# Quota volontairement large : la démo porte sur le gaspillage INTERNE au
# workload, pas sur un blocage par quota.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-checkout-quota
  namespace: team-checkout
  labels:
    team: team-checkout
    product: checkout-api
    env: lab
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    pods: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: team-checkout-limitrange
  namespace: team-checkout
  labels:
    team: team-checkout
    product: checkout-api
    env: lab
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 4Gi
