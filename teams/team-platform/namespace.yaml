---
# team-platform — namespace + garde-fous
# Profil : baseline efficace (requests = usage réel). Voir behavior.md.
apiVersion: v1
kind: Namespace
metadata:
  name: team-platform
  labels:
    team: team-platform
    product: platform-observability
    env: lab
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-platform-quota
  namespace: team-platform
  labels:
    team: team-platform
    product: platform-observability
    env: lab
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: team-platform-limitrange
  namespace: team-platform
  labels:
    team: team-platform
    product: platform-observability
    env: lab
spec:
  limits:
    - type: Container
      default:
        cpu: 200m
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "1"
        memory: 1Gi
