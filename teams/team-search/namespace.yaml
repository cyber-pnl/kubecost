---
# team-search — namespace + garde-fous
# Profil : ressources orphelines (PVC détaché, LoadBalancer sans backend).
apiVersion: v1
kind: Namespace
metadata:
  name: team-search
  labels:
    team: team-search
    product: search-db
    env: lab
---
# Le quota autorise explicitement storage + LoadBalancer pour que les
# orphelins puissent être créés et observés par Kubecost.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-search-quota
  namespace: team-search
  labels:
    team: team-search
    product: search-db
    env: lab
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    pods: "10"
    persistentvolumeclaims: "4"
    requests.storage: 10Gi
    services.loadbalancers: "2"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: team-search-limitrange
  namespace: team-search
  labels:
    team: team-search
    product: search-db
    env: lab
spec:
  limits:
    - type: Container
      default:
        cpu: 200m
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "1"
        memory: 1Gi
